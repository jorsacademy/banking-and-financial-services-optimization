[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-financial-services-optimization"
version = "0.1.0"
description = "Operations Research and prescriptive analytics examples for banking and financial services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src", "projects/cash-supply-chain-optimization/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
